name: CI

on:
  push:
    branches: [develop]
  # Every pull request is gated, including release branches cut after this workflow lands.
  pull_request: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "26.12.1"
  NPM_VERSION: "11.19.1"
  RUST_VERSION: "1.99.0"
  WASM_TARGET: "wasm32-unknown-unknown"
  WASM_PACK_VERSION: "0.15.0"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_LLVM_COV_VERSION: "0.8.7"
  # Pull requests restore caches but never save them: a pull request's cache can only be
  # restored by that same pull request, so saving there fills the 10 GB budget and evicts
  # the develop caches every branch shares.
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      docs_required: ${{ steps.paths.outputs.docs_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun downloads
        id: bun-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - name: Classify documentation impact
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/ci-paths.ts >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component llvm-tools-preview --target "$WASM_TARGET"
      - name: Assert clean checkout and exact toolchain
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          bun scripts/verify-clean-build.ts --assert-absent
          test "$(bun --version)" = "$BUN_VERSION"
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(rustc --version | cut -d' ' -f2)" = "$RUST_VERSION"
      - name: Changeset status
        run: bun run changeset:ci
      - name: Install checksum-pinned wasm-pack
        run: bun scripts/install-wasm-pack.ts
      - name: Tooling contracts
        run: bun run test:tooling
      - name: Import cycles
        run: bun run check:cycles
      - name: JavaScript dependency audit
        run: bun run audit:js
      - name: Cache cargo-audit
        id: cargo-audit
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-audit-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: Rust dependency audit
        working-directory: packages/wasm
        run: cargo audit
      - name: Rust lint
        run: bun run lint:rust
      - name: Lint
        run: bun run lint
      - name: Save Bun downloads cache
        if: env.SAVE_CACHE == 'true' && steps.bun-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-downloads.outputs.cache-primary-key }}
      - name: Save cargo-audit cache
        if: env.SAVE_CACHE == 'true' && steps.cargo-audit.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-audit.outputs.cache-primary-key }}

  unit-coverage:
    name: Unit Tests & Coverage
    needs: artifact-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun downloads
        id: bun-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - name: Cache Rust coverage compilation
        id: rust-coverage-compilation
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/wasm/target
            ~/.cargo/registry
            ~/.cargo/git
          key: coverage-target-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ env.CARGO_LLVM_COV_VERSION }}-${{ hashFiles('rust-toolchain.toml', 'packages/wasm/Cargo.lock', 'packages/wasm/Cargo.toml', 'packages/wasm/src/**/*.rs') }}
          restore-keys: |
            coverage-target-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ env.CARGO_LLVM_COV_VERSION }}-
      - name: Cache release verification tools
        id: release-verification-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-llvm-cov
          key: release-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ env.CARGO_AUDIT_VERSION }}-${{ env.CARGO_LLVM_COV_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component llvm-tools-preview --target "$WASM_TARGET"
      - name: Install coverage toolchain
        run: command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked
      # `bench:verify` launches Chromium only; Firefox and WebKit are exercised
      # separately by `browser-smoke`.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium for the render smoke
        run: bun run browser:install:chromium
      - name: Download canonical tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-release-artifacts
          path: test-results/release-artifacts
      - name: Verify and hydrate canonical package outputs
        env:
          ARTIFACT_DIGEST: ${{ needs.artifact-build.outputs.artifact_digest }}
        run: |
          test -n "$ARTIFACT_DIGEST"
          bun scripts/hydrate-release-artifacts.ts test-results/release-artifacts
      - name: Unit and Rust tests
        run: |
          bun test packages test/browser/canvas-assertions.test.ts scripts/public-api.test.ts scripts/conformance.test.ts scripts/conformance-google.test.ts scripts/conformance-workbook-roundtrip.test.ts scripts/docs.test.ts scripts/formula-contract.test.ts scripts/ci-paths.test.ts scripts/indexnow.test.ts scripts/release-github.test.ts bench/test docs/test
          cargo test --manifest-path packages/wasm/Cargo.toml
          cargo test --manifest-path packages/wasm/Cargo.toml --features analysis
      - name: Type checks and public API
        run: |
          bun run typecheck
          bun run api:check
      - name: Benchmark smoke and safety ceilings (not regression evidence)
        run: bun run --filter '@sheetwrite/bench' bench:verify
      - name: Source coverage
        run: bun run test:coverage
      - name: Upload coverage evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage-failure-evidence
          path: |
            test-results/
            coverage/
          if-no-files-found: warn
      - name: Save Bun downloads cache
        if: env.SAVE_CACHE == 'true' && steps.bun-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-downloads.outputs.cache-primary-key }}
      - name: Save Rust coverage compilation cache
        if: env.SAVE_CACHE == 'true' && steps.rust-coverage-compilation.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/wasm/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-coverage-compilation.outputs.cache-primary-key }}
      - name: Save release verification tools cache
        if: env.SAVE_CACHE == 'true' && steps.release-verification-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-llvm-cov
          key: ${{ steps.release-verification-tools.outputs.cache-primary-key }}
      - name: Save Chromium cache
        if: env.SAVE_CACHE == 'true' && steps.chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium.outputs.cache-primary-key }}

  artifact-build:
    name: Canonical Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun downloads
        id: bun-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - name: Cache Rust and WASM compilation
        id: rust-and-wasm-compilation
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/wasm/target
            packages/wasm/pkg
            packages/formulas/pkg
            ~/.cargo/registry
            ~/.cargo/git
          key: wasm-target-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ env.WASM_PACK_VERSION }}-${{ hashFiles('rust-toolchain.toml', 'packages/wasm/Cargo.*', 'packages/wasm/src/**', 'packages/wasm/build.rs', 'packages/wasm/package.json', 'packages/formulas/package.json', 'scripts/wasm-factory.ts', 'scripts/workspace-tooling.ts', 'bun.lock') }}
          restore-keys: |
            wasm-target-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ env.WASM_PACK_VERSION }}-
      - name: Cache release verification tools
        id: release-verification-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-llvm-cov
          key: release-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ env.CARGO_AUDIT_VERSION }}-${{ env.CARGO_LLVM_COV_VERSION }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component llvm-tools-preview --target "$WASM_TARGET"
      - name: Install release verification tools
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked
      - name: Install dependencies and wasm-pack
        run: |
          bun install --frozen-lockfile
          bun scripts/install-wasm-pack.ts
      - name: Validate compatibility test set
        run: bun run compatibility:validate
      - name: Build and pack once
        run: bun run release:prepare -- --mode release --output test-results/release-artifacts
      - name: Verify local compatibility results
        run: bun run compatibility:check -- --allow-unclaimed
      - name: Verify manifest before upload
        run: bun run release:verify-artifacts -- --input test-results/release-artifacts
      - name: Upload canonical tarballs
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-release-artifacts
          path: test-results/release-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Save Bun downloads cache
        if: env.SAVE_CACHE == 'true' && steps.bun-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-downloads.outputs.cache-primary-key }}
      - name: Save Rust and WASM compilation cache
        if: env.SAVE_CACHE == 'true' && steps.rust-and-wasm-compilation.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/wasm/target
            packages/wasm/pkg
            packages/formulas/pkg
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-and-wasm-compilation.outputs.cache-primary-key }}
      - name: Save release verification tools cache
        if: env.SAVE_CACHE == 'true' && steps.release-verification-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-llvm-cov
          key: ${{ steps.release-verification-tools.outputs.cache-primary-key }}

  packed-consumers:
    name: Packed Consumers
    needs: artifact-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun downloads
        id: bun-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Chromium
        id: chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bun run browser:install:chromium
      - name: Download canonical tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-release-artifacts
          path: test-results/release-artifacts
      - name: Verify downloaded bytes and digest contract
        env:
          ARTIFACT_DIGEST: ${{ needs.artifact-build.outputs.artifact_digest }}
        run: |
          test -n "$ARTIFACT_DIGEST"
          bun run release:verify-artifacts -- --input test-results/release-artifacts
      - name: Test locked packed consumers
        run: bun run verify:packed -- --artifacts test-results/release-artifacts --locked
      - name: Save Bun downloads cache
        if: env.SAVE_CACHE == 'true' && steps.bun-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-downloads.outputs.cache-primary-key }}
      - name: Save Chromium cache
        if: env.SAVE_CACHE == 'true' && steps.chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium.outputs.cache-primary-key }}

  bundler-consumers:
    name: Bundler Consumers
    needs: artifact-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun downloads
        id: bun-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Chromium
        id: chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bun run browser:install:chromium
      - name: Download canonical tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-release-artifacts
          path: test-results/release-artifacts
      - name: Verify downloaded bytes and digest contract
        env:
          ARTIFACT_DIGEST: ${{ needs.artifact-build.outputs.artifact_digest }}
        run: |
          test -n "$ARTIFACT_DIGEST"
          bun run release:verify-artifacts -- --input test-results/release-artifacts
      - name: Test locked bundler consumers
        run: bun run verify:bundlers -- --artifacts test-results/release-artifacts --locked
      - name: Save Bun downloads cache
        if: env.SAVE_CACHE == 'true' && steps.bun-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-downloads.outputs.cache-primary-key }}
      - name: Save Chromium cache
        if: env.SAVE_CACHE == 'true' && steps.chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium.outputs.cache-primary-key }}

  delivery-size:
    name: Delivery Size
    needs: artifact-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@$NPM_VERSION"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun downloads
        id: bun-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Chromium
        id: chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bun run browser:install:chromium
      - name: Download canonical tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-release-artifacts
          path: test-results/release-artifacts
      - name: Verify downloaded bytes and digest contract
        env:
          ARTIFACT_DIGEST: ${{ needs.artifact-build.outputs.artifact_digest }}
        run: |
          test -n "$ARTIFACT_DIGEST"
          bun run release:verify-artifacts -- --input test-results/release-artifacts
      - name: Record delivery sizes
        run: bun scripts/size-report.ts report --artifacts test-results/release-artifacts
      - name: Upload delivery size evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-evidence
          path: scripts/size-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Save Bun downloads cache
        if: env.SAVE_CACHE == 'true' && steps.bun-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-downloads.outputs.cache-primary-key }}
      - name: Save Chromium cache
        if: env.SAVE_CACHE == 'true' && steps.chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium.outputs.cache-primary-key }}

  docs-build:
    name: Production Docs
    needs: [preflight, artifact-build, delivery-size]
    if: needs.preflight.outputs.docs_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun downloads
        id: bun-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download canonical tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical-release-artifacts
          path: test-results/release-artifacts
      - name: Download delivery size evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: size-evidence
          path: scripts
      - name: Verify and hydrate canonical package outputs
        env:
          ARTIFACT_DIGEST: ${{ needs.artifact-build.outputs.artifact_digest }}
        run: |
          test -n "$ARTIFACT_DIGEST"
          bun scripts/hydrate-release-artifacts.ts test-results/release-artifacts
      - name: Generate, check, and build production docs
        run: |
          bun run docs:generate
          bun run --filter '@sheetwrite/docs-start' typecheck
          bun run --filter '@sheetwrite/docs-start' build
      - name: Package prebuilt deployment
        run: bun run docs:prepare-deployment
      - name: Upload production docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-docs
          path: .vercel/output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Save Bun downloads cache
        if: env.SAVE_CACHE == 'true' && steps.bun-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-downloads.outputs.cache-primary-key }}

  browser-smoke:
    name: Browser Smoke (${{ matrix.shard }}/3)
    needs: docs-build
    runs-on: ubuntu-latest
    # The image ships the browsers and their system libraries. Installing them
    # with apt on every run took up to the whole timeout on slow mirrors.
    # Keep the tag equal to the locked @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-bun needs unzip, which the Playwright image lacks; npm ships the
      # same pinned Bun binary as a package.
      - name: Setup Bun
        run: |
          npm install --prefix "$HOME/.bun-npm" --no-save "bun@$BUN_VERSION"
          echo "$HOME/.bun-npm/node_modules/.bin" >> "$GITHUB_PATH"
          test "$("$HOME/.bun-npm/node_modules/.bin/bun" --version)" = "$BUN_VERSION"
      - name: Cache Bun downloads
        id: bun-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download production docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-docs
          path: .vercel/output
      - name: Exercise production site
        env:
          DOCS_OUTPUT_DIR: .vercel/output/static
        run: bun run test:browser --workers=2 --shard=${{ matrix.shard }}/3
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence-${{ matrix.shard }}
          path: |
            test-results/playwright/
            playwright-report/
          if-no-files-found: warn
      - name: Save Bun downloads cache
        if: env.SAVE_CACHE == 'true' && steps.bun-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-downloads.outputs.cache-primary-key }}



  required:
    name: Required CI
    if: always()
    needs:
      - preflight
      - unit-coverage
      - artifact-build
      - packed-consumers
      - bundler-consumers
      - delivery-size
      - docs-build
      - browser-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI branch
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          UNIT_COVERAGE: ${{ needs.unit-coverage.result }}
          ARTIFACT_BUILD: ${{ needs.artifact-build.result }}
          PACKED: ${{ needs.packed-consumers.result }}
          BUNDLERS: ${{ needs.bundler-consumers.result }}
          SIZE: ${{ needs.delivery-size.result }}
          DOCS: ${{ needs.docs-build.result }}
          BROWSER: ${{ needs.browser-smoke.result }}
          DOCS_REQUIRED: ${{ needs.preflight.outputs.docs_required }}
        run: |
          test "$PREFLIGHT" = success
          test "$UNIT_COVERAGE" = success
          test "$ARTIFACT_BUILD" = success
          test "$PACKED" = success
          test "$BUNDLERS" = success
          test "$SIZE" = success
          if [ "$DOCS_REQUIRED" = "true" ]; then
            test "$DOCS" = success
            test "$BROWSER" = success
          else
            test "$DOCS_REQUIRED" = "false"
            test "$DOCS" = skipped
            test "$BROWSER" = skipped
          fi

  docs-deploy:
    name: Deploy Production Docs
    needs: [required, docs-build]
    if: >-
      success() && github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      github.event.repository.fork == false &&
      needs.required.result == 'success' && needs['docs-build'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Download tested production docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-docs
          path: .vercel/output
      - name: Deploy prebuilt production docs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=false
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              printf '::error::Set %s in repository or Production environment secrets before deploying.\n' "$name"
              missing=true
            fi
          done
          if [ "$missing" = true ]; then
            exit 1
          fi
          # One archive upload instead of one request per file: the free plan
          # allows 5,000 file uploads a day, and a docs build has thousands.
          npx --yes vercel@59.25.0 deploy --prebuilt --prod --yes --archive=tgz --token "$VERCEL_TOKEN"
      - name: Submit deployed sitemap to IndexNow
        env:
          VERCEL_ENV: production
          DOCS_OUTPUT_DIR: .vercel/output/static
        run: bun scripts/indexnow.ts
