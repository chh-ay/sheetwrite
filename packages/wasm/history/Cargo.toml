[package]
name = "sheetwrite-history"
version = "0.6.1"
edition = "2021"
license = "MIT"
description = "History-only cell diff kernel for Sheetwrite version history (Rust/WASM)."
repository = "https://github.com/chh-ay/sheetwrite"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "sheetwrite_history"

[dependencies]
wasm-bindgen = "0.2"

# The kernel loads only when a diff opens, so it is built for size: it has no
# formula engine and no hot inner loop that needs aggressive inlining.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]

# The three crates share this lint set; `bun scripts/rust-lint.ts` fails when
# their `[lints]` tables differ. Policy and examples: docs/contributing/rust.md.
# A lint at "warn" still fails CI when its count rises above
# scripts/rust-lint-baseline.json; it moves to "deny" once it reaches zero.

[lints.rust]
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_incompatible_pat = "warn"
unnameable_types = "warn"
unreachable_pub = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_lifetimes = "warn"
unused_must_use = "deny"

[lints.rustdoc]
all = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Pedantic and nursery lints.
borrow_as_ptr = "warn"
branches_sharing_code = "warn"
checked_conversions = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
cognitive_complexity = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
derive_partial_eq_without_eq = "warn"
doc_markdown = "warn"
empty_line_after_doc_comments = "warn"
empty_line_after_outer_attr = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
fn_params_excessive_bools = "warn"
if_not_else = "warn"
if_then_some_else_none = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
iter_without_into_iter = "warn"
large_stack_frames = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_assert = "warn"
manual_clamp = "warn"
manual_is_variant_and = "warn"
manual_string_new = "warn"
match_same_arms = "warn"
missing_const_for_fn = "warn"
must_use_candidate = "warn"
naive_bytecount = "warn"
needless_bitwise_bool = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
nonstandard_macro_braces = "warn"
option_as_ref_cloned = "warn"
option_option = "warn"
or_fun_call = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
redundant_else = "warn"
ref_option = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_self_not_must_use = "warn"
single_char_pattern = "warn"
single_match_else = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suspicious_operation_groupings = "warn"
too_many_lines = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
transmute_undefined_repr = "warn"
trivial_regex = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
uninlined_format_args = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
unnested_or_patterns = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"
while_float = "warn"
zero_sized_map_values = "warn"

# Restriction lints. Tests may unwrap, expect and panic (clippy.toml).
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
deref_by_slicing = "warn"
empty_drop = "warn"
exit = "warn"
expect_used = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
shadow_reuse = "warn"
shadow_same = "warn"
str_to_string = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

# Off: noisy for this code, or covered by another rule.
len_without_is_empty = "allow"
literal_string_with_formatting_args = "allow"
# `mul_add` and `hypot` round differently from the separate operations that
# Excel performs, and WASM has no fused multiply-add instruction.
imprecise_flops = "allow"
suboptimal_flops = "allow"
needless_collect = "allow"
new_ret_no_self = "allow"
redundant_pub_crate = "allow"
result_large_err = "allow"
too_long_first_doc_paragraph = "allow"
wrong_self_convention = "allow"
