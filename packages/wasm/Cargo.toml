[package]
name = "sheetwrite-wasm"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Sheetwrite columnar store and data engine (Rust/WASM)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "sheetwrite_wasm"

[features]
default = ["formula-engine"]
formula-engine = []
analysis = ["formula-engine", "host-functions", "dep:regex-lite"]
# Formulas that call JavaScript functions the host registers. Only the full
# engine (`@sheetwrite/formulas`, built with `analysis`) carries it.
host-functions = ["formula-engine"]

[dependencies]
wasm-bindgen = "0.2"
regex-lite = { version = "0.1.9", optional = true, default-features = false, features = ["std", "string"] }
rustc-hash = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.102"

# v0.4.0 interleaved captures keep `3`: `"s"` saves 14,218 Brotli bytes
# but slows the resolved 100k formula paths by 8.60–11.71%.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# wasm-opt inlines every function that has one caller, after LLVM and its
# `#[inline(never)]` are done. The evaluator's `*_family` handlers must stay
# out of line so `CellStore::eval_ast` stays far below 100,000 bytes, the size
# above which JavaScriptCore never compiles a function with its optimizing
# tier (see `eval_func` in src/eval/mod.rs). `--no-inline` must come before
# `-O3`: wasm-opt runs passes in order. It takes one pattern, matched against
# the demangled names wasm-bindgen writes.
[package.metadata.wasm-pack.profile.release]
# Keep names for the function-size guard in wasm-factory; it removes the name
# section before either engine is packaged.
wasm-opt = ["--no-inline=*_family", "-O3", "-g"]
