[package]
name = "sheetwrite-queries"
version = "0.6.1"
edition = "2021"
license = "MIT"
description = "Optional columnar query steps with typed buffers and no source fetching."
repository = "https://github.com/chh-ay/sheetwrite"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The engine and the Power Query codec build as separate artifacts, so a
# workbook that only runs queries never loads the M translation.
default = ["engine"]
engine = []
power-query = []

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--no-inline=*_family", "-O3", "-g"]
