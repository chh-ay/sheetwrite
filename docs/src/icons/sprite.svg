<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Sheetwrite icons. One language, drawn on a 24-unit grid:
    - 2-unit strokes with round joins and caps, set by the <svg> that uses a
      symbol (.sw-icon); 2-unit corner radius on containers, like cells.
    - Colour is currentColor. One accent, the icon accent token, marks the
      selection: the active cell and its fill handle, a found cell, a result,
      a live signal. Actions (arrows, undo, sort) stay pure strokes; things
      and states carry the accent.
  -->
